<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f" />
      <stop offset="50%" stop-color="#0f1c3f" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Neon Glows -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="700" rx="32" fill="url(#bgGrad)" />
  <rect width="600" height="700" rx="32" fill="url(#cyberGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="180" r="140" fill="#00f0ff" opacity="0.15" filter="url(#glow)" />
  <circle cx="450" cy="380" r="160" fill="#a855f7" opacity="0.12" filter="url(#glow)" />

  <!-- Geometric Tech Circuits / Lines -->
  <path d="M 50 120 L 150 120 L 200 170 L 400 170 L 450 120 L 550 120" fill="none" stroke="rgba(0, 240, 255, 0.3)" stroke-width="2" stroke-dasharray="8 4" />
  <circle cx="200" cy="170" r="4" fill="#00f0ff" />
  <circle cx="400" cy="170" r="4" fill="#a855f7" />

  <!-- Center Avatar Silhouette & Tech Badge -->
  <!-- Outer Hologram Ring -->
  <circle cx="300" cy="310" r="175" fill="none" stroke="url(#cyanGrad)" stroke-width="3" opacity="0.6" stroke-dasharray="16 8" filter="url(#glow)" />
  <circle cx="300" cy="310" r="155" fill="none" stroke="url(#purpleGrad)" stroke-width="2" opacity="0.4" />

  <!-- Head & Shoulders Silhouette -->
  <!-- Shoulders & Torso -->
  <path d="M 170 540 Q 300 470 430 540 L 450 640 L 150 640 Z" fill="#1e293b" stroke="url(#cyanGrad)" stroke-width="2.5" />
  <path d="M 230 510 L 300 580 L 370 510" fill="none" stroke="#00f0ff" stroke-width="3" opacity="0.8" />
  <circle cx="300" cy="580" r="6" fill="#10b981" />

  <!-- Neck -->
  <rect x="270" y="380" width="60" height="70" rx="10" fill="#334155" />

  <!-- Head / Face -->
  <ellipse cx="300" cy="310" rx="75" ry="90" fill="#1e293b" stroke="url(#cyanGrad)" stroke-width="2" />
  
  <!-- Cyber Visor / Tech Goggles -->
  <path d="M 240 290 Q 300 280 360 290 L 355 320 Q 300 335 245 320 Z" fill="url(#cyanGrad)" filter="url(#glow)" opacity="0.9" />
  <path d="M 255 305 L 345 305" stroke="#ffffff" stroke-width="2" opacity="0.8" />

  <!-- Headphones / Comm Set -->
  <rect x="210" y="280" width="18" height="55" rx="8" fill="#0ea5e9" stroke="#00f0ff" stroke-width="2" />
  <rect x="372" y="280" width="18" height="55" rx="8" fill="#0ea5e9" stroke="#00f0ff" stroke-width="2" />
  <path d="M 220 280 Q 300 190 380 280" fill="none" stroke="#00f0ff" stroke-width="6" />

  <!-- Tech Badges on Avatar -->
  <!-- CCNA / Network Node Badge -->
  <g transform="translate(180, 430)">
    <rect width="85" height="28" rx="14" fill="#091428" stroke="#10b981" stroke-width="1.5" />
    <circle cx="16" cy="14" r="5" fill="#10b981" />
    <text x="32" y="19" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">CCNA</text>
  </g>

  <!-- IT Pro Badge -->
  <g transform="translate(335, 430)">
    <rect width="90" height="28" rx="14" fill="#091428" stroke="#00f0ff" stroke-width="1.5" />
    <circle cx="16" cy="14" r="5" fill="#00f0ff" />
    <text x="30" y="19" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">IT PRO</text>
  </g>

  <!-- Watermark / Cyber Initials -->
  <text x="300" y="660" text-anchor="middle" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" letter-spacing="4">
    SATHYADEVAN G
  </text>
</svg>
